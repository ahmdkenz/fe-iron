<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <!-- Resolve theme synchronously, before loader.css is applied, so the -->
  <!-- splash never flashes the wrong theme. Mirrors resolveVuetifyTheme() -->
  <!-- in src/@core/utils/vuetify.js, hand-rolled since Vue isn't loaded yet. -->
  <!-- Ekstern (bukan inline) supaya CSP script-src bisa 'self' saja tanpa -->
  <!-- hash — public/ tidak diproses Vite jadi tetap render-blocking sama -->
  <!-- seperti inline sebelumnya. -->
  <script src="/theme-init.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap" />
  <!-- Fitur Al-Qur'an: font Arab khusus utk teks ayat (jelas terbaca, harakat akurat) -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Scheherazade+New:wght@400;700&display=swap" />

  <link rel="icon" type="image/png" href="/images/iron/Logo_IRON.png" />
  <link rel="apple-touch-icon" href="/images/iron/apple-touch-icon-180x180.png" />
  <meta name="theme-color" content="#666CFF" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="IRON" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
  <title>IRON - Intelligent Record of Organization Number</title>
  <link rel="stylesheet" type="text/css" href="/loader.css" />
</head>

<body>
  <!-- Loading screen — outside #app so Vue mount doesn't remove it prematurely -->
  <div id="loading-container">
    <!-- Gate panels that slide open once loading completes -->
    <div class="gate-panel gate-left"></div>
    <div class="gate-panel gate-right"></div>

    <div class="iron-content">
      <!-- Vault shield -->
      <div class="iron-shield-wrap">
        <svg class="iron-shield" id="iron-shield" viewBox="0 0 100 120" aria-hidden="true">
          <polygon class="iron-facet iron-facet-left" points="50,20 25,35 30,75 50,95" />
          <polygon class="iron-facet iron-facet-right" points="50,20 75,35 70,75 50,95" />
          <polygon class="iron-core" points="50,45 60,55 50,75 40,55" />
          <path class="iron-outline" pathLength="1" d="M 50 5 L 95 25 L 85 85 L 50 115 L 15 85 L 5 25 Z" />
          <path class="iron-nodes" pathLength="1" d="M 50 5 L 50 20 M 95 25 L 75 35 M 85 85 L 70 75 M 50 115 L 50 95 M 15 85 L 30 75 M 5 25 L 25 35" />
          <path class="iron-armor-outline" pathLength="1" d="M 50 20 L 75 35 L 70 75 L 50 95 L 30 75 L 25 35 Z" />
        </svg>
      </div>

      <!-- Brand title -->
      <div class="iron-brand-wrap" id="iron-brand-wrap">
        <span class="iron-title">I.R.O.N</span>
      </div>

      <!-- Scatter-assemble subtitle -->
      <div class="iron-subtitle-wrap">
        <span class="iron-subtitle" id="iron-decrypt"></span>
      </div>

      <!-- Divider line -->
      <div class="iron-divider" id="iron-divider"></div>

      <!-- Progress section -->
      <div class="iron-progress-section" id="iron-progress-section">
        <div class="iron-progress-track">
          <div class="iron-progress-fill" id="iron-progress-fill"></div>
          <div class="iron-progress-glow" id="iron-progress-glow"></div>
        </div>
        <div class="iron-progress-meta">
          <span class="iron-status" id="iron-status">Initializing...</span>
          <span class="iron-pct"><span id="iron-progress-pct">0</span>%</span>
        </div>
      </div>
    </div>

    <div class="iron-flash" id="iron-flash"></div>
  </div>

  <div id="app"></div>

  <script type="module" src="/src/main.js"></script>

  <script src="/loading-screen.js"></script>
</body>

</html>
