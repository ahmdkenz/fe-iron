# nginx.conf

server {
    listen 80;
    server_name localhost;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # max-age 1 minggu (604800) untuk staged rollout — naikkan ke 31536000 (1 tahun)
    # setelah dipastikan aman di production beberapa minggu. Browser mengabaikan header
    # ini di response HTTP biasa (per spec), jadi aman ditulis unconditional di sini
    # walau TLS termination terjadi di reverse proxy di depan container ini.
    add_header Strict-Transport-Security "max-age=604800; includeSubDomains" always;

    # script-src 'self' saja: 2 inline script di index.html (theme resolver, loading
    # screen) sudah dipindah ke public/theme-init.js & public/loading-screen.js supaya
    # tidak butuh 'unsafe-inline'/hash. style-src butuh 'unsafe-inline' karena Vuetify
    # inject inline <style>. connect-src: api.iron.shezaerp.net (REST + Reverb
    # WebSocket, host sama per be-iron/.env REVERB_HOST) + bigdatacloud.net
    # (reverse-geocoding lokasi user, lihat src/composables/useUserLocation.js).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data:; connect-src 'self' https://api.iron.shezaerp.net wss://api.iron.shezaerp.net https://api.bigdatacloud.net; object-src 'none'; frame-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Additional configurations go here...
}
